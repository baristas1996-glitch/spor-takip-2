<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="app-shell">
  <aside class="sidebar">

      <div class="brand-symbol"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 18v12M11 12v24M17 18v12M31 18v12M37 12v24M43 18v12M17 24h14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></div>
      <div><strong>Spor Takip <span>2.0</span></strong><small>Antrenman Takip Uygulaması</small></div>
    </div>
    <nav aria-label="Ana menü">
      <button class="active" data-tab="home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><span>Ana Sayfa</span></button>
      <button data-tab="train"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9v6m4-9v12m4-9v6m6-6v6m4-9v12m-10-6h6"/></svg></span><span>Antrenman</span></button>
      <button data-tab="programs"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></span><span>Programlar</span></button>
      <button data-tab="history"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Geçmiş</span></button>
      <button data-tab="progress"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20v-7h4v7M10 20V9h4v11M16 20V4h4v16"/></svg></span><span>Gelişim</span></button>
      <button data-tab="weight"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M7 4V2m10 2V2"/></svg></span><span>Vücut Ağırlığı</span></button>
      <button data-tab="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 18h11a4 4 0 0 0 .5-8A6.5 6.5 0 0 0 6 8.5 4.8 4.8 0 0 0 7 18z"/></svg></span><span>Hesap & Bulut</span></button>

    <div class="sidebar-bottom">
      <div class="sidebar-cloud"><span class="cloud-symbol">☁</span><div><b>Bulut Hesabı</b><small id="sidebarCloud">Bağlı değil</small></div></div>
      <button class="sidebar-user" id="sidebarAccount"><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4.3 3.2-6.5 8-6.5s7.5 2.2 8 6.5"/></svg></span><span id="sidebarUsername">Misafir</span><span class="user-gear">⚙</span></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="mobile-brand"><span class="mobile-brand-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 18v12M11 12v24M17 18v12M31 18v12M37 12v24M43 18v12M17 24h14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span><span class="mobile-brand-copy"><span class="mobile-brand-name">Spor Takip <b>2.0</b></span><small>Antrenman Takip Uygulaması</small></span></div>

      <div class="cloud-pill" id="cloudStatus"><svg class="cloud-pill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 18.5h11a4 4 0 0 0 .4-8A6.5 6.5 0 0 0 5.3 9.4a4.6 4.6 0 0 0 1.2 9.1Z"/><path d="m9 12.5 2 2 4-4"/></svg><span class="cloud-pill-text">Bulut: Bağlı değil</span></div>

    </header>
    <main><div id="view"></div></main>
    <footer class="app-footer">Spor Takip 2.0 <span>·</span> Antrenmanlarını kaydet, gelişimini takip et.</footer>
  </div>

<nav class="mobile-tabs" aria-label="Alt menü">
  <button class="active" data-tab="home"><span><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><small>Ana Sayfa</small></button>

  <button data-tab="history"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small>Geçmiş</small></button>
  <button data-tab="progress"><span><svg viewBox="0 0 24 24"><path d="M4 20v-7h4v7M10 20V9h4v11M16 20V4h4v16"/></svg></span><small>Gelişim</small></button>
</nav>
<div id="toast" class="toast" role="status"></div>
<div id="modal"></div>
<script src="./app.js" defer></script>
</body>
</html>
