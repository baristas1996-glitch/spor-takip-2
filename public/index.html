<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spor Takip 2.0">
<title>Spor Takip 2.0</title>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-symbol">✣</div>
      <div><strong>Spor Takip <span>2.0</span></strong><small>Antrenman Takip Uygulaması</small></div>
    </div>
    <nav aria-label="Ana menü">
      <button class="active" data-tab="home"><span class="nav-icon">⌂</span><span>Ana Sayfa</span></button>
      <button data-tab="train"><span class="nav-icon">✚</span><span>Antrenman</span></button>
      <button data-tab="programs"><span class="nav-icon">▱</span><span>Programlar</span></button>
      <button data-tab="history"><span class="nav-icon">◷</span><span>Geçmiş</span></button>
      <button data-tab="progress"><span class="nav-icon">▥</span><span>Gelişim</span></button>
      <button data-tab="weight"><span class="nav-icon">▤</span><span>Vücut Ağırlığı</span></button>
      <button data-tab="settings"><span class="nav-icon">☁</span><span>Hesap & Bulut</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-cloud"><span class="cloud-symbol">☁</span><div><b>Bulut Hesabı</b><small id="sidebarCloud">Bağlı değil</small></div></div>
      <button class="sidebar-user" id="sidebarAccount"><span class="avatar">●</span><span id="sidebarUsername">Misafir</span><span class="user-gear">⚙</span></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="mobile-brand"><span>✣</span> Spor Takip <b>2.0</b></div>
      <div class="top-page-title" id="topPageTitle">Ana Sayfa</div><div class="topbar-spacer"></div>
      <div class="cloud-pill" id="cloudStatus"><span class="cloud-indicator">●</span> Bulut: Bağlı değil</div>
      <button id="account" class="account-button" aria-label="Bulut hesabı">●</button>
    </header>
    <main><div id="view"></div></main>
    <footer class="app-footer">Spor Takip 2.0 <span>·</span> Antrenmanlarını kaydet, gelişimini takip et.</footer>
  </div>
</div>
<nav class="mobile-tabs" aria-label="Alt menü">
  <button class="active" data-tab="home"><span>⌂</span><small>Ana Sayfa</small></button>
  <button data-tab="train"><span>✚</span><small>Antrenman</small></button>
  <button data-tab="programs"><span>▱</span><small>Programlar</small></button>
  <button data-tab="history"><span>◷</span><small>Geçmiş</small></button>
  <button data-tab="progress"><span>▥</span><small>Gelişim</small></button>
  <button data-tab="weight"><span>▤</span><small>Ağırlık</small></button>
  <button data-tab="settings"><span>☁</span><small>Hesap</small></button>
</nav>
<div id="toast" class="toast" role="status"></div>
<div id="modal"></div>
<script src="./app.js" defer></script>
</body>
</html>
